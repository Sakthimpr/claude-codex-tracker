<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Claude &amp; Codex Tracker</title>
<style>
  :root {
    --bg:        #1a1a1e;
    --card:      #242428;
    --border:    rgba(255,255,255,0.08);
    --text:      #e8e8ec;
    --muted:     rgba(232,232,236,0.75);
    --green:     #3aad74;
    --amber:     #c8963a;
    --red:       #e0303a;
    --divider:   rgba(255,255,255,0.40);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
    font-size: 14px;
    min-height: 100dvh;
    padding: 40px 12px 32px;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  header h1 {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.3px;
  }
  #last-updated {
    font-size: 13px;
    color: var(--text);
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 16px 22px;
    margin-bottom: 16px;
  }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .card-title {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: #e8e8ec;
  }
  .plan-badge {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.8px;
    padding: 3px 8px;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.25);
    color: #e8e8ec;
    background: rgba(255,255,255,0.10);
  }
  .dials-row {
    display: flex;
    justify-content: space-around;
    align-items: flex-start;
    position: relative;
  }
  .dials-row .divider {
    position: absolute;
    left: 33%;
    top: 8%;
    bottom: 20%;
    width: 1px;
    background: var(--divider);
  }
  .dial-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1;
  }
  .dial-wrap svg {
    display: block;
    overflow: visible;
  }
  .dial-label {
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    margin-top: 4px;
    text-align: center;
  }
  .dial-pct {
    font-size: 20px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    text-align: center;
  }
  .shared-reset {
    font-size: 10px;
    color: rgba(232,232,236,0.88);
    text-align: center;
    margin-top: 2px;
    flex: 2;
    padding-top: 68px;
  }
  .status-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 10px;
    font-size: 13px;
    color: var(--muted);
  }
  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--green);
    flex-shrink: 0;
  }
  .status-dot.amber { background: var(--amber); }
  .status-dot.red   { background: var(--red); }
  .warning-banner {
    background: rgba(224,48,58,0.15);
    border: 1px solid rgba(224,48,58,0.35);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 12px;
    color: #ff8080;
    margin-top: 10px;
    display: none;
  }
  .refresh-btn {
    display: block;
    width: 100%;
    margin-top: 20px;
    padding: 12px;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    text-align: center;
  }
  .refresh-btn:active { background: rgba(255,255,255,0.12); }
  #error-msg {
    color: #ff8080;
    font-size: 12px;
    text-align: center;
    margin-top: 14px;
    display: none;
  }
</style>
</head>
<body>
<header>
  <h1>Claude &amp; Codex - Usage</h1>
  <span id="last-updated">Loading…</span>
</header>

<div class="card" id="claude-card">
  <div class="card-header">
    <span class="card-title">Claude</span>
    <span class="plan-badge" id="claude-plan">—</span>
  </div>
  <div class="dials-row" id="claude-dials">
    <div class="divider"></div>
    <div class="dial-wrap" id="cd-current">
      <svg width="90" height="90" viewBox="0 0 90 90"></svg>
      <div class="dial-pct" id="cd-current-pct">—</div>
      <div class="dial-label">Current</div>
    </div>
    <div class="dial-wrap" id="cd-allmodels">
      <svg width="90" height="90" viewBox="0 0 90 90"></svg>
      <div class="dial-pct" id="cd-allmodels-pct">—</div>
      <div class="dial-label">All Models</div>
    </div>
    <div class="dial-wrap" id="cd-design">
      <svg width="90" height="90" viewBox="0 0 90 90"></svg>
      <div class="dial-pct" id="cd-design-pct">—</div>
      <div class="dial-label">Design</div>
    </div>
  </div>
  <div style="display:flex; align-items:center; margin-top:10px;">
    <div style="flex:1; display:flex; align-items:center; gap:6px; font-size:13px; color:var(--muted);">
      <span class="status-dot" id="cd-current-dot"></span>
      <span id="cd-current-reset"></span>
    </div>
    <div style="flex:2; display:flex; align-items:center; justify-content:center; gap:6px; font-size:12px; color:rgba(232,232,236,0.88);">
      <span class="status-dot" id="cd-weekly-dot"></span>
      <span id="claude-weekly-reset"></span>
    </div>
  </div>
  <div class="warning-banner" id="claude-warning"></div>
</div>

<div class="card" id="codex-card">
  <div class="card-header">
    <span class="card-title">Codex</span>
    <span class="plan-badge" id="codex-plan">—</span>
  </div>
  <div class="dials-row" id="codex-dials">
    <div class="dial-wrap" id="cx-current">
      <svg width="110" height="110" viewBox="0 0 110 110"></svg>
      <div class="dial-pct" id="cx-current-pct">—</div>
      <div class="dial-label">Current</div>
      <div class="status-row">
        <span class="status-dot" id="cx-current-dot"></span>
        <span id="cx-current-reset"></span>
      </div>
    </div>
    <div class="dial-wrap" id="cx-weekly">
      <svg width="110" height="110" viewBox="0 0 110 110"></svg>
      <div class="dial-pct" id="cx-weekly-pct">—</div>
      <div class="dial-label">Weekly</div>
      <div class="status-row">
        <span class="status-dot" id="cx-weekly-dot"></span>
        <span id="cx-weekly-reset"></span>
      </div>
    </div>
  </div>
  <div class="warning-banner" id="codex-warning"></div>
</div>

<button class="refresh-btn" onclick="window.location.reload()">Refresh now</button>
<div id="error-msg"></div>

<script>
window.SUPABASE_URL      = 'https://vpclpdcfulgfqlsreeun.supabase.co';
window.SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZwY2xwZGNmdWxnZnFsc3JlZXVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3MzA0MTAsImV4cCI6MjA5NDMwNjQxMH0.DohEN71AOtFr-wbd71JanMXupy9Jx6TnXkx8d8a-BcI';
</script>
<script>
const GREEN = '#3aad74', AMBER = '#c8963a', RED = '#e0303a', TRACK = 'rgba(255,255,255,0.10)';

function dialColor(pct) {
  if (pct === null || pct === undefined) return TRACK;
  if (pct >= 80) return RED;
  if (pct >= 50) return AMBER;
  return GREEN;
}

function dotClass(pct) {
  if (pct === null || pct === undefined) return '';
  if (pct >= 80) return 'red';
  if (pct >= 50) return 'amber';
  return '';
}

function describeArc(cx, cy, r, startDeg, endDeg) {
  const toRad = d => (d - 90) * Math.PI / 180;
  const s = toRad(startDeg), e = toRad(endDeg);
  const x1 = cx + r * Math.cos(s), y1 = cy + r * Math.sin(s);
  const x2 = cx + r * Math.cos(e), y2 = cy + r * Math.sin(e);
  const large = (endDeg - startDeg) > 180 ? 1 : 0;
  return `M ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2}`;
}

function drawDial(svgEl, pct, size) {
  svgEl.innerHTML = '';
  const cx = size / 2, cy = size / 2;
  const r = size * 0.38;
  const tw = size * 0.08;
  const startAngle = 135, totalSweep = 270;

  const track = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  track.setAttribute('d', describeArc(cx, cy, r, startAngle, startAngle + totalSweep));
  track.setAttribute('fill', 'none');
  track.setAttribute('stroke', TRACK);
  track.setAttribute('stroke-width', tw);
  track.setAttribute('stroke-linecap', 'round');
  svgEl.appendChild(track);

  const clampedPct = Math.min(100, Math.max(0, pct || 0));
  if (clampedPct > 0) {
    const sweep = totalSweep * clampedPct / 100;
    const fill = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    fill.setAttribute('d', describeArc(cx, cy, r, startAngle, startAngle + sweep));
    fill.setAttribute('fill', 'none');
    fill.setAttribute('stroke', dialColor(clampedPct));
    fill.setAttribute('stroke-width', tw + 2);
    fill.setAttribute('stroke-linecap', 'round');
    svgEl.appendChild(fill);
  }
}

function pctInt(str) {
  if (!str || str === '—') return null;
  return parseInt(str.replace('%', ''), 10);
}

function setDot(elId, pct) {
  const el = document.getElementById(elId);
  if (!el) return;
  el.className = 'status-dot ' + dotClass(pct);
}

function checkWarning(bannerEl, ...pcts) {
  const any = pcts.some(p => p !== null && p >= 80);
  if (any) {
    const worst = pcts.reduce((a, b) => (b !== null && b > (a || 0) ? b : a), null);
    bannerEl.style.display = 'block';
    bannerEl.textContent = worst >= 100 ? '⚠ Limit reached' : `⚠ ${worst}% used — approaching limit`;
  } else {
    bannerEl.style.display = 'none';
  }
}

function formatSyncTime(raw) {
  if (!raw) return '';
  const parts = raw.trim().split(/\s+/);
  if (parts.length < 3) return raw;
  const day = parseInt(parts[0], 10), mon = parts[1], timeParts = parts[2].split(':');
  let h = parseInt(timeParts[0], 10);
  const m = timeParts[1];
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const sameDay = new Date().getDate() === day && months[new Date().getMonth()] === mon;
  return sameDay ? `↻ Mac-${h}.${m}${ampm}` : `↻ Mac-${day} ${mon} ${h}.${m}${ampm}`;
}

function render(d) {
  const c = d.claude || {};
  const x = d.codex  || {};

  document.getElementById('last-updated').textContent = formatSyncTime(d.last_updated);
  document.getElementById('claude-plan').textContent  = c.plan_label || '—';
  document.getElementById('codex-plan').textContent   = x.plan_label || '—';

  const cSPct = pctInt(c.session_pct);
  const cWPct = pctInt(c.weekly_pct);
  const cDPct = pctInt(c.design_weekly_pct);
  const xSPct = pctInt(x.session_pct);
  const xWPct = pctInt(x.weekly_pct);

  drawDial(document.querySelector('#cd-current svg'),    cSPct, 90);
  drawDial(document.querySelector('#cd-allmodels svg'),  cWPct, 90);
  drawDial(document.querySelector('#cd-design svg'),     cDPct, 90);
  drawDial(document.querySelector('#cx-current svg'),    xSPct, 110);
  drawDial(document.querySelector('#cx-weekly svg'),     xWPct, 110);

  document.getElementById('cd-current-pct').textContent  = c.session_pct   || '—';
  document.getElementById('cd-allmodels-pct').textContent = c.weekly_pct    || '—';
  document.getElementById('cd-design-pct').textContent   = c.design_weekly_pct || '—';
  document.getElementById('cx-current-pct').textContent  = x.session_pct   || '—';
  document.getElementById('cx-weekly-pct').textContent   = x.weekly_pct    || '—';

  document.getElementById('cd-current-reset').textContent  = (c.session_reset || '').replace('Resets', '↻');
  document.getElementById('claude-weekly-reset').textContent = (c.weekly_reset || '').replace('Resets', '↻');
  document.getElementById('cx-current-reset').textContent  = (x.session_reset || '').replace('Resets', '↻');
  document.getElementById('cx-weekly-reset').textContent   = (x.weekly_reset  || '').replace('Resets', '↻');

  setDot('cd-current-dot', cSPct);
  setDot('cd-weekly-dot',  cWPct !== null || cDPct !== null ? Math.max(cWPct ?? 0, cDPct ?? 0) : null);
  setDot('cx-current-dot', xSPct);
  setDot('cx-weekly-dot',  xWPct);

  document.getElementById('cd-current-pct').style.color  = dialColor(cSPct);
  document.getElementById('cd-allmodels-pct').style.color = dialColor(cWPct);
  document.getElementById('cd-design-pct').style.color   = dialColor(cDPct);
  document.getElementById('cx-current-pct').style.color  = dialColor(xSPct);
  document.getElementById('cx-weekly-pct').style.color   = dialColor(xWPct);

  checkWarning(document.getElementById('claude-warning'), cSPct, cWPct, cDPct);
  checkWarning(document.getElementById('codex-warning'),  xSPct, xWPct);
}

async function loadData() {
  const errEl = document.getElementById('error-msg');
  const btn   = document.querySelector('.refresh-btn');
  errEl.style.display = 'none';
  if (btn) { btn.textContent = 'Refreshing…'; btn.disabled = true; }
  try {
    const url   = window.SUPABASE_URL  + '/rest/v1/tracker_snapshot?id=eq.1&select=data';
    const key   = window.SUPABASE_ANON_KEY;
    const resp  = await fetch(url, {
      headers: { 'apikey': key, 'Authorization': 'Bearer ' + key },
      cache: 'no-store'
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const rows  = await resp.json();
    if (!rows.length) throw new Error('No data yet — run the Mac tracker first');
    const d = JSON.parse(rows[0].data);
    render(d);
  } catch (e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  } finally {
    if (btn) { btn.textContent = 'Refresh now'; btn.disabled = false; }
  }
}

loadData();
setInterval(loadData, 60000);
</script>
</body>
</html>
